         site to one theme (the build writes which one here, from content/site/visibility.json); applied before the first draw. -->
    <script>try { var only = '__THEME_ONLY__'; if ((only || localStorage.getItem('cs.theme')) === 'dark') document.documentElement.dataset.theme = 'dark' } catch (e) {}</script>
